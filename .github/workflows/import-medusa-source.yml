name: Import Medusa licence-filtered reference source

# One-time push trigger plus manual rerun. Standard runners are free for public repositories.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-medusa-source.yml']

permissions:
  contents: write

concurrency:
  group: medusa-source-import
  cancel-in-progress: false

jobs:
  import-current-upstream-source:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Check source branch does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/medusa-upstream-snapshot >/dev/null 2>&1; then
            echo "::error::Snapshot branch exists. This import will not overwrite it."
            exit 1
          fi

      - name: Download complete tracked files from Medusa develop (not full history)
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone \
            --depth=1 --single-branch --branch develop --filter=blob:none \
            https://github.com/medusajs/medusa.git upstream
          cd upstream
          git fetch --depth=1 origin 01de0be27a7c228795d5cfc31662ca144781fbfc
          git checkout --detach 01de0be27a7c228795d5cfc31662ca144781fbfc
          test "$(git rev-parse HEAD)" = "01de0be27a7c228795d5cfc31662ca144781fbfc"
          git rev-parse HEAD > ../UPSTREAM_COMMIT
          git rev-parse 'HEAD^{tree}' > ../UPSTREAM_TREE
          git ls-tree -r --name-only HEAD | wc -l | tee ../UPSTREAM_TRACKED_FILE_COUNT
          if [ -f .gitmodules ]; then
            echo "::warning::Upstream contains submodules: their content is not included in the Git superproject snapshot."
            cat .gitmodules
          fi
          if [ -f .gitattributes ] && grep -Eq 'filter=lfs' .gitattributes; then
            echo "::warning::Upstream declares Git LFS paths; verify that binary LFS objects are available separately."
          fi

      - name: Determine exact Enterprise Materials excluded by upstream licence
        run: |
          set -euo pipefail
          cd upstream
          python3 - <<'PY'
          import pathlib, re, subprocess
          license_text=pathlib.Path('ENTERPRISE-LICENSE.md').read_text()
          start=license_text.index('## Enterprise Materials')
          end=license_text.index('Generated, compiled, bundled',start)
          section=license_text[start:end]
          specs=re.findall(r'^- `([^`]+)`$',section,re.M)
          if len(specs)<40:
              raise SystemExit('Enterprise path list unexpectedly incomplete')
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD']).decode().splitlines()
          excluded=sorted({p for p in paths if any(
              p.startswith(spec) if spec.endswith('/') else p==spec for spec in specs)})
          if not excluded:
              raise SystemExit('Enterprise exclusions unexpectedly empty')
          pathlib.Path('../EXCLUDED_ENTERPRISE_PATHS').write_text(''.join(p+'\n' for p in excluded))
          print(f'Enterprise licence specs: {len(specs)}; excluded Git paths: {len(excluded)}')
          PY

      - name: Create licence-filtered immutable source snapshot
        run: |
          set -euo pipefail
          cd upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_TREE="$(cat ../UPSTREAM_TREE)"
          git checkout --orphan medusa-upstream-snapshot
          git read-tree --empty
          git read-tree --prefix=upstream/ "$SOURCE_TREE"
          while IFS= read -r path; do
            [ -n "$path" ] && git update-index --force-remove -- "upstream/$path"
          done < ../EXCLUDED_ENTERPRISE_PATHS
          test "$(git ls-tree --name-only "$(git write-tree)")" = "upstream"
          git -c core.hooksPath=/dev/null commit --quiet \
            -m "Medusa community research source excluding separately licensed enterprise paths"
          git rev-parse 'HEAD:upstream' > ../FILTERED_TREE
          git ls-tree -r --name-only HEAD:upstream | wc -l | tee ../RETAINED_FILE_COUNT
          test "$(git rev-parse HEAD:upstream/LICENSE)" = "$(git rev-parse "$SOURCE_TREE:LICENSE")"
          test "$(git rev-parse HEAD:upstream/ENTERPRISE-LICENSE.md)" = "$(git rev-parse "$SOURCE_TREE:ENTERPRISE-LICENSE.md")"
          git fsck --no-reflogs --connectivity-only

      - name: Push snapshot branch to research repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git remote add research "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null push research HEAD:refs/heads/medusa-upstream-snapshot

      - name: Verify uploaded snapshot against upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git fetch research medusa-upstream-snapshot --depth=1
          LOCAL_TREE="$(git rev-parse 'HEAD:upstream')"
          REMOTE_TREE="$(git rev-parse 'FETCH_HEAD:upstream')"
          test "${LOCAL_TREE}" = "${REMOTE_TREE}"
          test "${REMOTE_TREE}" = "$(cat ../FILTERED_TREE)"
          test "$(cat ../UPSTREAM_TREE)" = "f832114f0e597e1480c74630d954a4db22ded5ae"
          echo "Verified matching Git tree: ${REMOTE_TREE}"
          echo "Upstream source commit: $(cat ../UPSTREAM_COMMIT)"
          echo "Upstream tracked-file count: $(cat ../UPSTREAM_TRACKED_FILE_COUNT)"
          echo "Retained source file count: $(cat ../RETAINED_FILE_COUNT)"
          echo "Excluded proprietary paths: $(wc -l < ../EXCLUDED_ENTERPRISE_PATHS)"
          echo "Imported branch: medusa-upstream-snapshot"
