name: One-time pinned medusa source identity audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/medusajs/medusa.git
      upstream_sha: 01de0be27a7c228795d5cfc31662ca144781fbfc
      audit_slug: medusa
